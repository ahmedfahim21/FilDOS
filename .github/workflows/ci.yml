name: CI

# Lint, typecheck, and run the desktop app's test suites on every target platform.
on:
  push:
    branches: [main]
    paths-ignore: ['website/**', '**/*.md']
  pull_request:
    paths-ignore: ['website/**', '**/*.md']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint

  eval-smoke:
    # Eval wiring on bag-of-words embeddings (no model downloads): builds the
    # testbed, indexes it, runs the search/index/graph suites end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Testbed media come from a pinned dataset revision (SHA-256 checked), so
      # the cache can't go stale; it keeps the job off the network.
      - uses: actions/cache@v4
        with:
          path: eval/.media-cache
          key: eval-media-${{ hashFiles('eval/testbed/manifest.ts') }}
      # The eval decodes the testbed's audio/video with ffmpeg (the app uses Chromium).
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Eval (smoke)
        run: npm run eval:smoke

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & integration tests
        run: npm test

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Linux CI has no display; run the Electron smoke tests under a virtual one.
      - name: E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: E2E (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
